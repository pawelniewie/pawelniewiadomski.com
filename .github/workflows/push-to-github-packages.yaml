name: Create and publish a Docker image

on:
  workflow_run:
    workflows: [ "Run Tests" ]
    types:
      - completed
    branches:
      - master
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    if: ${{ (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'skipped') && !contains(github.event.workflow_run.head_commit.message, '[skip-deploy]') }}

    permissions:
      contents: read
      packages: write
      id-token: write # assume the AWS ECS deploy role via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current time
        id: current-time
        uses: josStorer/get-current-time@v2

      - name: Set lowercase repository
        id: lowercase_repository
        uses: actions/github-script@v7
        with:
          script: |
            return context.repo.owner.toLowerCase() + "/" + context.repo.repo.toLowerCase()
          result-encoding: string

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase_repository.outputs.result }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=${{ steps.current-time.outputs.time }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.lowercase_repository.outputs.result }}:master
          cache-to: type=gha,mode=max

      # Deploy the newly pushed image to ECS (pawelniewiadomski.com). Master only.
      - name: Configure AWS credentials
        if: github.event.workflow_run.head_branch == 'master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::471112519766:role/prod-github-actions-ecs-deploy-role
          aws-region: us-east-1

      - name: Deploy to ECS
        if: github.event.workflow_run.head_branch == 'master'
        env:
          IMAGE_TAG: ${{ steps.current-time.outputs.time }}
        run: |
          set -euo pipefail
          CLUSTER=prod-ecs
          SERVICE=prod-pawelniewiadomski-com-website
          CONTAINER=pawelniewiadomski-com-website
          td=$(aws ecs describe-task-definition --task-definition "$SERVICE" --query 'taskDefinition')
          cur=$(jq -r --arg c "$CONTAINER" '.containerDefinitions[]|select(.name==$c)|.image' <<<"$td")
          new="${cur%:*}:${IMAGE_TAG}"
          echo "Deploying $SERVICE: $cur -> $new"
          reg=$(jq --arg c "$CONTAINER" --arg img "$new" \
            '.containerDefinitions |= map(if .name==$c then .image=$img else . end)
             | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' <<<"$td")
          arn=$(aws ecs register-task-definition --cli-input-json "$reg" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$arn" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Deployed $SERVICE -> $arn"
